name: Veilgram edit history core tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/edit-history-tests.yml'

permissions:
  contents: read

jobs:
  edit-history:
    if: github.repository == 'Jigros/Veilgram-IOS'
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Checkout edit-history branch
        uses: actions/checkout@v4
        with:
          ref: feature/edit-history-core
          persist-credentials: false
          submodules: false

      - name: Compile and run edit-history tests
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
          xcrun swiftc -parse-as-library -warnings-as-errors \
            submodules/TelegramUI/Sources/VeilgramEditHistory.swift \
            tools/test_veilgram_edit_history.swift \
            -o "$RUNNER_TEMP/veilgram-edit-history-test"
          "$RUNNER_TEMP/veilgram-edit-history-test"

      - name: Enforce local-only core
        shell: bash
        run: |
          set -euo pipefail
          ! grep -E -n 'URLSession|NWConnection|API_HASH|API_ID|TelegramEngine|Postbox' submodules/TelegramUI/Sources/VeilgramEditHistory.swift
