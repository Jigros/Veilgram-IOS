name: Veilgram protected local store tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/protected-store-tests.yml'

permissions:
  contents: read

jobs:
  protected-store:
    if: github.repository == 'Jigros/Veilgram-IOS'
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Checkout protected-store branch
        uses: actions/checkout@v4
        with:
          ref: feature/protected-local-store
          persist-credentials: false
          submodules: false

      - name: Compile and run protected-store tests
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
          xcrun swiftc -parse-as-library -warnings-as-errors \
            submodules/TelegramUI/Sources/VeilgramProtectedLocalStore.swift \
            tools/test_veilgram_protected_local_store.swift \
            -o "$RUNNER_TEMP/veilgram-protected-store-test"
          "$RUNNER_TEMP/veilgram-protected-store-test"

      - name: Reject auth/network dependencies
        shell: bash
        run: |
          set -euo pipefail
          ! grep -E -n 'URLSession|NWConnection|API_HASH|API_ID|TelegramEngine|Postbox' submodules/TelegramUI/Sources/VeilgramProtectedLocalStore.swift
