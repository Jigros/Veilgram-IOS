name: Veilgram native ad filter tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/native-adfilter-tests.yml'

permissions:
  contents: read

jobs:
  adfilter:
    if: github.repository == 'Jigros/Veilgram-IOS'
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Checkout candidate Swift sources
        uses: actions/checkout@v4
        with:
          ref: feature/native-channel-ad-classifier
          persist-credentials: false
          submodules: false

      - name: Compile native filter with strict Swift diagnostics
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun swiftc -parse-as-library -warnings-as-errors \
            submodules/TelegramUI/Sources/VeilgramChannelAdClassifier.swift \
            tools/test_veilgram_channel_ad_classifier.swift \
            -o "$RUNNER_TEMP/veilgram-adfilter-test"
          "$RUNNER_TEMP/veilgram-adfilter-test"

      - name: Verify no network dependencies in detector
        shell: bash
        run: |
          set -euo pipefail
          ! grep -E -n 'URLSession|NWConnection|Alamofire|HTTPClient|\.post\(' submodules/TelegramUI/Sources/VeilgramChannelAdClassifier.swift
