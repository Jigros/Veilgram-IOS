name: Veilgram filter persistence integration tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/filter-persistence-tests.yml'

permissions:
  contents: read

jobs:
  filter-persistence:
    if: github.repository == 'Jigros/Veilgram-IOS'
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Checkout filter persistence branch
        uses: actions/checkout@v4
        with:
          ref: feature/filter-persistence-integration
          persist-credentials: false
          submodules: false

      - name: Compile and run filter persistence tests
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
          xcrun swiftc -parse-as-library -warnings-as-errors \
            submodules/TelegramUI/Sources/VeilgramMessageFilter.swift \
            submodules/TelegramUI/Sources/VeilgramProtectedLocalStore.swift \
            submodules/TelegramUI/Sources/VeilgramTransferEnvelope.swift \
            submodules/TelegramUI/Sources/VeilgramMessageFilterPersistence.swift \
            tools/test_veilgram_filter_persistence.swift \
            -o "$RUNNER_TEMP/veilgram-filter-persistence-test"
          "$RUNNER_TEMP/veilgram-filter-persistence-test"

      - name: Reject network and Telegram auth dependencies
        shell: bash
        run: |
          set -euo pipefail
          ! grep -E -n 'URLSession|NWConnection|TelegramEngine|Postbox' \
            submodules/TelegramUI/Sources/VeilgramMessageFilterPersistence.swift \
            submodules/TelegramUI/Sources/VeilgramProtectedLocalStore.swift
