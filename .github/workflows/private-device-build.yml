name: Private Veilgram iPhone build

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Git ref to build
        required: true
        default: cleanup/remove-project-policy-guards
      build_number:
        description: Local build number
        required: true
        default: "100"

permissions:
  contents: read

concurrency:
  group: private-veilgram-device-build
  cancel-in-progress: false

jobs:
  private-device:
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - name: Checkout requested source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          submodules: false
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve pinned submodules
        shell: bash
        run: |
          set -euo pipefail
          git config submodule.submodules/rlottie/rlottie.url https://github.com/TelegramMessenger/rlottie.git
          git config submodule.submodules/TgVoipWebrtc/tgcalls.url https://github.com/TelegramMessenger/tgcalls.git
          if ! git -c protocol.file.allow=never submodule update --init --recursive --depth 1; then
            echo "Shallow submodule update failed; retrying full pinned checkout."
            git submodule sync --recursive
            git -c protocol.file.allow=never submodule update --init --recursive
          fi

      - name: Verify required secrets exist
        shell: bash
        env:
          VEILGRAM_API_ID: ${{ secrets.VEILGRAM_API_ID }}
          VEILGRAM_API_HASH: ${{ secrets.VEILGRAM_API_HASH }}
          VEILGRAM_ARTIFACT_PASSWORD: ${{ secrets.VEILGRAM_ARTIFACT_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$VEILGRAM_API_ID"
          test -n "$VEILGRAM_API_HASH"
          test -n "$VEILGRAM_ARTIFACT_PASSWORD"
          echo "::add-mask::$VEILGRAM_API_ID"
          echo "::add-mask::$VEILGRAM_API_HASH"
          echo "::add-mask::$VEILGRAM_ARTIFACT_PASSWORD"
          test "${#VEILGRAM_API_HASH}" -eq 32
          case "$VEILGRAM_API_ID" in (*[!0-9]*|'') exit 1;; esac

      - name: Select pinned toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
          test "$(xcodebuild -version | head -1)" = "Xcode 26.2"
          test "$(sw_vers -productVersion | cut -d. -f1)" = "26"

          brew list bazelisk >/dev/null 2>&1 || brew install bazelisk
          mkdir -p "$RUNNER_TEMP/veilgram-bin"
          ln -sf "$(brew --prefix bazelisk)/bin/bazelisk" "$RUNNER_TEMP/veilgram-bin/bazel"
          echo "$RUNNER_TEMP/veilgram-bin" >> "$GITHUB_PATH"
          echo "USE_BAZEL_VERSION=8.4.2" >> "$GITHUB_ENV"

          export PATH="$RUNNER_TEMP/veilgram-bin:$PATH"
          export USE_BAZEL_VERSION=8.4.2
          test "$(bazel --version | awk '{print $2}')" = "8.4.2"

      - name: Restore safe public device Bazel cache
        uses: actions/cache/restore@v4
        with:
          path: ~/veilgram-public-device-bazel-cache
          key: veilgram-public-device-macos26-xcode26.2-bazel8.4.2-private-${{ github.run_id }}
          restore-keys: |
            veilgram-public-device-macos26-xcode26.2-bazel8.4.2-

      - name: Restore encrypted private Bazel cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/veilgram-private-bazel-cache.tar.enc
          key: veilgram-private-bazel-encrypted-v1-macos26-xcode26.2-bazel8.4.2-${{ github.run_id }}
          restore-keys: |
            veilgram-private-bazel-encrypted-v1-macos26-xcode26.2-bazel8.4.2-

      - name: Prepare private Bazel cache
        shell: bash
        env:
          VEILGRAM_ARTIFACT_PASSWORD: ${{ secrets.VEILGRAM_ARTIFACT_PASSWORD }}
        run: |
          set -euo pipefail
          private_cache="$HOME/veilgram-private-device-bazel-cache"
          encrypted_cache="$RUNNER_TEMP/veilgram-private-bazel-cache.tar.enc"
          public_cache="$HOME/veilgram-public-device-bazel-cache"

          rm -rf "$private_cache"
          mkdir -p "$private_cache"

          if [ -s "$encrypted_cache" ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 250000 \
              -in "$encrypted_cache" \
              -pass env:VEILGRAM_ARTIFACT_PASSWORD \
              | tar -xf - -C "$private_cache"
            echo "Restored encrypted private Bazel cache."
          elif [ -d "$public_cache" ] && find "$public_cache" -type f -print -quit | grep -q .; then
            cp -a "$public_cache/." "$private_cache/"
            echo "Seeded private cache from fixture-only public Bazel cache."
          else
            echo "No reusable Bazel cache found; this run will seed the encrypted private cache."
          fi

      - name: Create private API input
        shell: bash
        env:
          VEILGRAM_API_ID: ${{ secrets.VEILGRAM_API_ID }}
          VEILGRAM_API_HASH: ${{ secrets.VEILGRAM_API_HASH }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p .veilgram-private
          {
            printf 'APP_ID=%s\n' "$VEILGRAM_API_ID"
            printf 'APP_HASH=%s\n' "$VEILGRAM_API_HASH"
          } > .veilgram-private/API_KEYS
          chmod 600 .veilgram-private/API_KEYS

      - name: Run secret-safe preflight
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v tools/test_private_device_build.py
          python3 tools/private_device_build.py --preflight-only

      - name: Build private ARM64 iPhone IPA
        id: private_build
        shell: bash
        env:
          VEILGRAM_ARTIFACT_PASSWORD: ${{ secrets.VEILGRAM_ARTIFACT_PASSWORD }}
        run: |
          set -euo pipefail
          python3 tools/private_device_build.py \
            --build-number "${{ inputs.build_number }}" \
            --cache-dir "$HOME/veilgram-private-device-bazel-cache"
          ipa="$(find .veilgram-private/artifacts -maxdepth 1 -type f -name '*.ipa' -print -quit)"
          test -n "$ipa"
          mkdir -p "$RUNNER_TEMP/private-output"
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 250000 \
            -in "$ipa" \
            -out "$RUNNER_TEMP/private-output/Veilgram-private.ipa.enc" \
            -pass env:VEILGRAM_ARTIFACT_PASSWORD
          shasum -a 256 "$RUNNER_TEMP/private-output/Veilgram-private.ipa.enc" \
            > "$RUNNER_TEMP/private-output/Veilgram-private.ipa.enc.sha256"
          find .veilgram-private/artifacts -maxdepth 1 -type f \( \
            -name '*.manifest.json' -o -name '*.platform.json' -o \
            -name '*.identity.json' -o -name '*.branding.json' \
          \) -exec cp {} "$RUNNER_TEMP/private-output/" \;
          rm -f "$ipa"

      - name: Encrypt private Bazel cache for reuse
        id: private_cache_pack
        if: ${{ always() && steps.private_build.outcome != 'cancelled' }}
        shell: bash
        env:
          VEILGRAM_ARTIFACT_PASSWORD: ${{ secrets.VEILGRAM_ARTIFACT_PASSWORD }}
        run: |
          set -euo pipefail
          cache_dir="$HOME/veilgram-private-device-bazel-cache"
          encrypted_cache="$RUNNER_TEMP/veilgram-private-bazel-cache.tar.enc"

          if [ -z "$VEILGRAM_ARTIFACT_PASSWORD" ] || [ ! -d "$cache_dir" ] || ! find "$cache_dir" -type f -print -quit | grep -q .; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python3 - "$cache_dir" <<'PY'
          import os
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          limit = 2200 * 1024 * 1024
          files = []
          total = 0
          for path in root.rglob("*"):
              if not path.is_file():
                  continue
              try:
                  stat = path.stat()
              except OSError:
                  continue
              total += stat.st_size
              files.append((stat.st_mtime_ns, stat.st_size, path))

          if total > limit:
              files.sort()
              for _, size, path in files:
                  if total <= limit:
                      break
                  try:
                      path.unlink()
                      total -= size
                  except OSError:
                      pass
          print(f"Private Bazel cache retained bytes: {total}")
          PY

          rm -f "$encrypted_cache"
          tar -cf - -C "$cache_dir" . \
            | openssl enc -aes-256-cbc -salt -pbkdf2 -iter 250000 \
                -out "$encrypted_cache" \
                -pass env:VEILGRAM_ARTIFACT_PASSWORD
          chmod 600 "$encrypted_cache"
          test -s "$encrypted_cache"

          rm -rf "$cache_dir"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Save encrypted private Bazel cache
        if: ${{ always() && steps.private_cache_pack.outputs.ready == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/veilgram-private-bazel-cache.tar.enc
          key: veilgram-private-bazel-encrypted-v1-macos26-xcode26.2-bazel8.4.2-${{ github.run_id }}

      - name: Ensure plaintext IPA is not uploaded
        shell: bash
        run: |
          set -euo pipefail
          if find "$RUNNER_TEMP/private-output" -type f -name '*.ipa' | grep -q .; then
            echo "Plaintext IPA found in upload directory" >&2
            exit 1
          fi
          test -s "$RUNNER_TEMP/private-output/Veilgram-private.ipa.enc"

      - name: Upload encrypted private build
        uses: actions/upload-artifact@v4
        with:
          name: veilgram-private-device-encrypted
          retention-days: 1
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/private-output/Veilgram-private.ipa.enc
            ${{ runner.temp }}/private-output/Veilgram-private.ipa.enc.sha256
            ${{ runner.temp }}/private-output/*.json
