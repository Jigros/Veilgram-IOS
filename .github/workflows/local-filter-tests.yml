name: Veilgram local message filter tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/local-filter-tests.yml'

permissions:
  contents: read

jobs:
  filters:
    if: github.repository == 'Jigros/Veilgram-IOS'
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Checkout local filter branch
        uses: actions/checkout@v4
        with:
          ref: feature/local-message-filters
          persist-credentials: false
          submodules: false

      - name: Compile and run local filter tests
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
          xcrun swiftc -parse-as-library -warnings-as-errors \
            submodules/TelegramUI/Sources/VeilgramMessageFilter.swift \
            tools/test_veilgram_message_filter.swift \
            -o "$RUNNER_TEMP/veilgram-filter-test"
          "$RUNNER_TEMP/veilgram-filter-test"

      - name: Reject network and credential dependencies
        shell: bash
        run: |
          set -euo pipefail
          ! grep -E -n 'URLSession|NWConnection|API_HASH|API_ID|Authorization|\.post\(' submodules/TelegramUI/Sources/VeilgramMessageFilter.swift
