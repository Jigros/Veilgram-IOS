name: BUILD-1 Veilgram branded simulator (manual preview)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build1:
    if: github.repository == 'Jigros/Veilgram-IOS'
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - name: Checkout branded product source
        uses: actions/checkout@v4
        with:
          ref: cleanup/remove-project-policy-guards
          submodules: false
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve upstream-relative Git submodule URLs
        shell: bash
        run: |
          set -euo pipefail
          # Official upstream uses relative URLs; on a standalone Veilgram
          # repository they incorrectly resolve to non-existent Jigros repos.
          # Override only checkout-local config, preserving tracked .gitmodules
          # and every pinned gitlink SHA.
          git config submodule.submodules/rlottie/rlottie.url https://github.com/TelegramMessenger/rlottie.git
          git config submodule.submodules/TgVoipWebrtc/tgcalls.url https://github.com/TelegramMessenger/tgcalls.git
          git -c protocol.file.allow=never submodule update --init --recursive
          git submodule status --recursive > "$RUNNER_TEMP/build1-submodules.txt"

      - name: Validate source and toolchain
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check_veilgram_branding.py
          python3 -m py_compile tools/verify_build1_ipa.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          v = json.loads(Path("versions.json").read_text())
          assert v["macos"] == "26", v
          assert v["xcode"] == "26.2", v
          assert v["bazel"].split(":")[0] == "8.4.2", v
          PY
          test "$(sw_vers -productVersion | cut -d. -f1)" = "26"
          sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
          xcodebuild -version
          test "$(xcodebuild -version | head -1)" = "Xcode 26.2"
          git rev-parse HEAD > "$RUNNER_TEMP/build1-source-sha.txt"
          echo "Branded source SHA: $(cat "$RUNNER_TEMP/build1-source-sha.txt")"
          date -u +%Y-%m-%dT%H:%M:%SZ > "$RUNNER_TEMP/build1-date.txt"

      - name: Generate synthetic compile-only config
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          base = json.loads(Path("build-system/template_minimal_development_configuration.json").read_text())
          base.update(
              bundle_id="org.veilgram.buildone",
              api_id="1",
              api_hash="0" * 32,
              team_id="AAAAAAAAAA",
              app_specific_url_scheme="veilgram-buildone"
          )
          Path("build1-configuration.json").write_text(json.dumps(base), encoding="utf-8")
          PY
          printf '\nbuild --//Telegram:disableProvisioningProfiles\n' >> .bazelrc

      - name: Compile branded simulator (not an installable signed build)
        shell: bash
        run: |
          set -uo pipefail
          python3 -u build-system/Make/Make.py \
            --cacheDir="$RUNNER_TEMP/veilgram-bazel-cache" \
            build \
            --configurationPath=build1-configuration.json \
            --xcodeManagedCodesigning \
            --configuration=debug_sim_arm64 \
            --buildNumber=1 2>&1 | tee "$RUNNER_TEMP/build1-compile.log"
          result=${PIPESTATUS[0]}
          echo "Compile exit: $result"
          printf '%s\n' "$result" > "$RUNNER_TEMP/build1-exit-code.txt"
          if [ "$result" -ne 0 ]; then
            tail -n 100 "$RUNNER_TEMP/build1-compile.log"
          fi
          exit "$result"

      - name: Validate IPA identity and record hash
        shell: bash
        run: |
          set -euo pipefail
          test -f bazel-bin/Telegram/Telegram.ipa
          cp bazel-bin/Telegram/Telegram.ipa "$RUNNER_TEMP/build1-simulator.ipa"
          python3 tools/verify_build1_ipa.py "$RUNNER_TEMP/build1-simulator.ipa" \
            --bundle-id org.veilgram.buildone \
            --report "$RUNNER_TEMP/build1-identity.json"
          shasum -a 256 "$RUNNER_TEMP/build1-simulator.ipa" > "$RUNNER_TEMP/build1-ipa.sha256"

      - name: Upload simulator test evidence (only when validated)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: build1-simulator-evidence
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/build1-simulator.ipa
            ${{ runner.temp }}/build1-source-sha.txt
            ${{ runner.temp }}/build1-date.txt
            ${{ runner.temp }}/build1-exit-code.txt
            ${{ runner.temp }}/build1-identity.json
            ${{ runner.temp }}/build1-ipa.sha256

      - name: Upload diagnostic compilation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build1-diagnostics
          retention-days: 7
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/build1-compile.log
            ${{ runner.temp }}/build1-exit-code.txt
            ${{ runner.temp }}/build1-source-sha.txt
            ${{ runner.temp }}/build1-submodules.txt
