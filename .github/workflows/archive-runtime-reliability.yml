name: Veilgram archive runtime reliability

on:
  push:
    branches:
      - cleanup/remove-project-policy-guards
    paths:
      - "submodules/VeilgramLocalFeatures/**"
      - "submodules/AccountContext/Sources/AccountContext.swift"
      - "submodules/Postbox/Sources/Postbox.swift"
      - "submodules/Postbox/Sources/MessageHistoryTable.swift"
      - "submodules/TelegramCore/Sources/State/AccountStateManagementUtils.swift"
      - "submodules/TelegramCore/Sources/State/HistoryViewStateValidation.swift"
      - "submodules/TelegramCore/Sources/State/ManagedAccountPresence.swift"
      - "submodules/TelegramCore/Sources/State/ManagedSynchronizeViewStoriesOperations.swift"
      - "submodules/TelegramCore/Sources/State/VeilgramArchiveStateAdapter.swift"
      - "submodules/TelegramCore/Sources/TelegramEngine/Peers/UpdateCachedPeerData.swift"
      - "submodules/TelegramCore/Sources/TelegramEngine/Messages/Stories.swift"
      - "submodules/TelegramCore/Sources/TelegramEngine/Messages/InstallInteractiveReadMessagesAction.swift"
      - "submodules/SettingsUI/Sources/Themes/ThemeSettingsController.swift"
      - "submodules/TelegramUI/Sources/AppDelegate.swift"
      - "submodules/TelegramUI/Sources/ChatController.swift"
      - "submodules/TelegramUI/Sources/ChatInterfaceStateContextMenus.swift"
      - "submodules/TelegramUI/Components/Chat/ChatMessageItemImpl/Sources/ChatMessageItemImpl.swift"
      - "submodules/TelegramUI/Components/Chat/ChatMessageItemView/Sources/ChatMessageItemView.swift"
      - "submodules/TelegramUI/Sources/AccountContext.swift"
      - "submodules/TelegramUI/Components/Stories/StoryContainerScreen/Sources/OpenStories.swift"
      - "submodules/TelegramUI/Components/PeerInfo/PeerInfoScreen/Sources/VeilgramLocalArchiveController.swift"
      - "submodules/TelegramUI/Components/PeerInfo/PeerInfoScreen/Sources/VeilgramLocalArchiveDetailController.swift"
      - "submodules/TelegramUI/Components/PeerInfo/PeerInfoScreen/Sources/VeilgramLocalTransferController.swift"
      - "submodules/TelegramUI/Components/PeerInfo/PeerInfoScreen/Sources/VeilgramSettingsController.swift"
      - "tools/test_veilgram_archive_runtime_batch.swift"
      - "tools/test_veilgram_channel_ad_classifier.swift"
      - "tools/test_veilgram_local_core_integration.swift"
      - "tools/check_veilgram_archive_delete_coverage.py"
      - "tools/check_veilgram_ad_render_stability.py"
      - "tools/check_veilgram_archive_ui.py"
      - "tools/check_veilgram_ghost_story_views.py"
      - "tools/check_veilgram_ghost_receipts.py"
      - "submodules/TelegramCore/Sources/State/AccountViewTracker.swift"
      - "submodules/TelegramCore/Sources/State/ManagedConsumePersonalMessagesActions.swift"
      - "submodules/TelegramCore/Sources/State/ManagedSynchronizeMarkAllUnseenPersonalMessagesOperations.swift"
      - "submodules/TelegramCore/Sources/TelegramEngine/Messages/ApplyMaxReadIndexInteractively.swift"
      - "submodules/TelegramCore/Sources/TelegramEngine/Messages/MarkAllChatsAsRead.swift"
      - "submodules/TelegramCore/Sources/TelegramEngine/Messages/ReplyThreadHistory.swift"
      - "tools/test_veilgram_ghost_receipts.swift"
      - "submodules/TelegramCore/Sources/State/ManagedSynchronizeConsumeMessageContentsOperations.swift"
      - "submodules/TelegramUI/Sources/ChatHistoryListNode.swift"
      - "submodules/TelegramUI/Sources/Chat/ChatControllerLoadDisplayNode.swift"
      - "tools/check_veilgram_local_premium.py"
      - "tools/check_veilgram_send_confirmation.py"
      - "tools/check_veilgram_native_scheduling.py"
      - "submodules/TelegramUI/Components/ChatScheduleTimeController/**"
      - "tools/check_veilgram_message_shot.py"
      - "submodules/AuthorizationUI/Sources/AuthorizationSequenceController.swift"
      - "submodules/CountrySelectionUI/Sources/AuthorizationSequenceCountrySelectionController.swift"
      - "submodules/CountrySelectionUI/Sources/AuthorizationSequenceCountrySelectionControllerNode.swift"
      - "submodules/TelegramUI/Resources/PhoneCountries.txt"
      - "tools/check_veilgram_auth_first_launch.py"
      - "tools/check_veilgram_capture_privacy.py"
      - ".github/workflows/archive-runtime-reliability.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: archive-runtime-reliability-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-tests:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1
          persist-credentials: false

      - name: Select pinned Xcode
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
          xcodebuild -version

      - name: Compile and run archive runtime batch tests
        shell: bash
        run: |
          set -euo pipefail
          sources=(submodules/VeilgramLocalFeatures/Sources/*.swift)
          xcrun swiftc -warnings-as-errors \
            "${sources[@]}" \
            tools/test_veilgram_archive_runtime_batch.swift \
            -o "$RUNNER_TEMP/test-archive-runtime-batch"
          "$RUNNER_TEMP/test-archive-runtime-batch"

      - name: Compile and run shared local-core integration tests
        shell: bash
        run: |
          set -euo pipefail
          sources=(submodules/VeilgramLocalFeatures/Sources/*.swift)
          xcrun swiftc -warnings-as-errors \
            "${sources[@]}" \
            tools/test_veilgram_local_core_integration.swift \
            -o "$RUNNER_TEMP/test-local-core"
          "$RUNNER_TEMP/test-local-core"

      - name: Compile and run unified ad render tests
        shell: bash
        run: |
          set -euo pipefail
          sources=(submodules/VeilgramLocalFeatures/Sources/*.swift)
          xcrun swiftc -warnings-as-errors \
            "${sources[@]}" \
            tools/test_veilgram_channel_ad_classifier.swift \
            -o "$RUNNER_TEMP/test-channel-ads"
          "$RUNNER_TEMP/test-channel-ads"
          python3 tools/check_veilgram_ad_render_stability.py
          xcrun swiftc -parse submodules/TelegramUI/Components/Chat/ChatMessageItemImpl/Sources/ChatMessageItemImpl.swift
          xcrun swiftc -parse submodules/TelegramUI/Components/Chat/ChatMessageItemView/Sources/ChatMessageItemView.swift

      - name: Check remote-delete archive coverage
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check_veilgram_archive_delete_coverage.py
          xcrun swiftc -parse \
            submodules/Postbox/Sources/Postbox.swift \
            submodules/Postbox/Sources/MessageHistoryTable.swift \
            submodules/TelegramCore/Sources/State/AccountStateManagementUtils.swift \
            submodules/TelegramCore/Sources/State/HistoryViewStateValidation.swift \
            submodules/TelegramCore/Sources/TelegramEngine/Peers/UpdateCachedPeerData.swift

      - name: Check archive UI completion
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check_veilgram_archive_ui.py
          xcrun swiftc -parse submodules/TelegramUI/Components/PeerInfo/PeerInfoScreen/Sources/VeilgramLocalArchiveDetailController.swift

      - name: Check Ghost Mode story-view suppression
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check_veilgram_ghost_story_views.py
          xcrun swiftc -parse \
            submodules/TelegramCore/Sources/State/ManagedAccountPresence.swift \
            submodules/TelegramCore/Sources/State/ManagedSynchronizeViewStoriesOperations.swift \
            submodules/TelegramCore/Sources/TelegramEngine/Messages/Stories.swift \
            submodules/TelegramCore/Sources/TelegramEngine/Messages/InstallInteractiveReadMessagesAction.swift \
            submodules/TelegramUI/Components/Stories/StoryContainerScreen/Sources/OpenStories.swift \
            submodules/TelegramUI/Components/PeerInfo/PeerInfoScreen/Sources/VeilgramSettingsController.swift

      - name: Check Ghost content receipts and interaction reads
        run: |
          python3 tools/check_veilgram_ghost_receipts.py
          xcrun swiftc -warnings-as-errors submodules/VeilgramLocalFeatures/Sources/VeilgramGhostModeRuntimePreferences.swift tools/test_veilgram_ghost_receipts.swift -o "$RUNNER_TEMP/test-ghost-receipts"
          "$RUNNER_TEMP/test-ghost-receipts"
          xcrun swiftc -parse submodules/TelegramCore/Sources/State/AccountViewTracker.swift submodules/TelegramCore/Sources/State/ManagedConsumePersonalMessagesActions.swift submodules/TelegramCore/Sources/State/ManagedSynchronizeMarkAllUnseenPersonalMessagesOperations.swift submodules/TelegramCore/Sources/TelegramEngine/Messages/ApplyMaxReadIndexInteractively.swift submodules/TelegramCore/Sources/TelegramEngine/Messages/MarkAllChatsAsRead.swift submodules/TelegramCore/Sources/TelegramEngine/Messages/ReplyThreadHistory.swift submodules/TelegramCore/Sources/State/ManagedSynchronizeConsumeMessageContentsOperations.swift submodules/TelegramUI/Sources/ChatHistoryListNode.swift submodules/TelegramUI/Sources/Chat/ChatControllerLoadDisplayNode.swift

      - name: Check Local Premium presentation boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check_veilgram_local_premium.py
          xcrun swiftc -parse submodules/AccountContext/Sources/AccountContext.swift
          xcrun swiftc -parse submodules/SettingsUI/Sources/Themes/ThemeSettingsController.swift
          xcrun swiftc -parse submodules/TelegramUI/Sources/AccountContext.swift

      - name: Check send confirmation path
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check_veilgram_send_confirmation.py
          xcrun swiftc -parse submodules/TelegramUI/Sources/ChatController.swift
          xcrun swiftc -parse submodules/TelegramUI/Components/PeerInfo/PeerInfoScreen/Sources/VeilgramSettingsController.swift

      - name: Check native scheduling and real Premium repeat boundary
        run: python3 tools/check_veilgram_native_scheduling.py

      - name: Check Message Shot
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check_veilgram_message_shot.py
          xcrun swiftc -parse submodules/TelegramUI/Sources/ChatInterfaceStateContextMenus.swift

      - name: Check first-launch auth race
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check_veilgram_auth_first_launch.py
          xcrun swiftc -parse submodules/AuthorizationUI/Sources/AuthorizationSequenceController.swift
          xcrun swiftc -parse submodules/CountrySelectionUI/Sources/AuthorizationSequenceCountrySelectionController.swift
          xcrun swiftc -parse submodules/CountrySelectionUI/Sources/AuthorizationSequenceCountrySelectionControllerNode.swift

      - name: Check capture privacy
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check_veilgram_capture_privacy.py
          xcrun swiftc -parse submodules/TelegramUI/Sources/AppDelegate.swift
          xcrun swiftc -parse submodules/TelegramUI/Components/PeerInfo/PeerInfoScreen/Sources/VeilgramSettingsController.swift

  ios-build:
    needs: swift-tests
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - name: Checkout runtime head
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve pinned submodules
        shell: bash
        run: |
          set -euo pipefail
          git config submodule.submodules/rlottie/rlottie.url https://github.com/TelegramMessenger/rlottie.git
          git config submodule.submodules/TgVoipWebrtc/tgcalls.url https://github.com/TelegramMessenger/tgcalls.git
          git -c protocol.file.allow=never submodule update --init --recursive

      - name: Select pinned toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
          test "$(xcodebuild -version | head -1)" = "Xcode 26.2"
          test "$(sw_vers -productVersion | cut -d. -f1)" = "26"

      - name: Generate compile-only config
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          base = json.loads(Path("build-system/template_minimal_development_configuration.json").read_text())
          base.update(
              bundle_id="org.veilgram.archivereliability",
              api_id="1",
              api_hash="0" * 32,
              team_id="AAAAAAAAAA",
              app_specific_url_scheme="veilgram-archive-reliability"
          )
          Path("archive-runtime-configuration.json").write_text(json.dumps(base), encoding="utf-8")
          PY
          printf '\nbuild --//Telegram:disableProvisioningProfiles\n' >> .bazelrc

      - name: Compile iOS simulator
        shell: bash
        run: |
          set -uo pipefail
          python3 -u build-system/Make/Make.py \
            --cacheDir="$RUNNER_TEMP/veilgram-bazel-cache" \
            build \
            --configurationPath=archive-runtime-configuration.json \
            --xcodeManagedCodesigning \
            --configuration=debug_sim_arm64 \
            --buildNumber=1 2>&1 | tee "$RUNNER_TEMP/archive-runtime-compile.log"
          result=${PIPESTATUS[0]}
          echo "Compile exit: $result"
          exit "$result"

      - name: Upload compile diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archive-runtime-reliability-diagnostics
          retention-days: 7
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/archive-runtime-compile.log
