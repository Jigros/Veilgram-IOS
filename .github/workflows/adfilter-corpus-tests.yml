name: Veilgram ad-filter corpus tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/adfilter-corpus-tests.yml'

permissions:
  contents: read

jobs:
  corpus:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/native-channel-ad-classifier
          persist-credentials: false
          submodules: false
      - name: Compile classifier and synthetic corpus
        shell: bash
        run: |
          set -euo pipefail
          xcrun swiftc -parse-as-library -warnings-as-errors \
            submodules/TelegramUI/Sources/VeilgramChannelAdClassifier.swift \
            tools/test_veilgram_adfilter_corpus.swift \
            -o "$RUNNER_TEMP/veilgram-adfilter-corpus"
          "$RUNNER_TEMP/veilgram-adfilter-corpus"
