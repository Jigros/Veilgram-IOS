name: Veilgram API configuration safety tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/auth-config-tests.yml'

permissions:
  contents: read

jobs:
  api-configuration:
    if: github.repository == 'Jigros/Veilgram-IOS'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout auth branch (no secrets)
        uses: actions/checkout@v4
        with:
          ref: feature/auth-source-config
          submodules: false
          fetch-depth: 1
          persist-credentials: false

      - name: Record source and assert local API files are ignored
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          git check-ignore -q API_KEYS
          git check-ignore -q .veilgram-private/API_KEYS
          ! git ls-files --error-unmatch API_KEYS > /dev/null 2>&1
          ! git ls-files --error-unmatch .veilgram-private/API_KEYS > /dev/null 2>&1

      - name: Python syntax and offline test suite
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/prepare_telegram_api_config.py tools/test_prepare_telegram_api_config.py
          python3 -m unittest discover -v -s tools -p 'test_prepare_telegram_api_config.py'

      - name: Compile-only fixture is never real login configuration
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/prepare_telegram_api_config.py \
            --source fixture \
            --output "$RUNNER_TEMP/veilgram-test-configuration.json" \
            --bundle-id org.veilgram.test \
            --team-id AAAAAAAAAA \
            --url-scheme veilgram-test
          python3 - "$RUNNER_TEMP/veilgram-test-configuration.json" <<'PY'
          import json,sys,os,stat
          path=sys.argv[1]
          config=json.load(open(path))
          assert config["api_id"]=="1"
          assert config["api_hash"]=="0"*32
          assert stat.S_IMODE(os.stat(path).st_mode)==0o600
          print("PASS: fixture-only configuration, no login credentials")
          PY
