name: Veilgram app candidate preflight
# latest candidate head

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/app-candidate-preflight.yml'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/veilgram-app-candidate
          persist-credentials: false
          submodules: false

      - name: Verify secret/config ignore rules
        shell: bash
        run: |
          set -euo pipefail
          grep -Fx '/API_KEYS' .gitignore
          grep -Fx '/veilgram-device-configuration.json' .gitignore
          grep -Fx '.veilgram-private/' .gitignore
          grep -Fx '*.p12' .gitignore
          grep -Fx '*.mobileprovision' .gitignore

      - name: Test API identity adapter without real credentials
        shell: bash
        run: |
          set -euo pipefail
          cd tools
          python3 -m unittest -v test_prepare_telegram_api_config.py

      - name: Generate fixture-only Telegram build config
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/veilgram-private"
          python3 tools/prepare_telegram_api_config.py \
            --source fixture \
            --output "$RUNNER_TEMP/veilgram-private/fixture.json" \
            --bundle-id org.veilgram.preflight \
            --team-id AAAAAAAAAA \
            --url-scheme veilgram-preflight
          python3 - "$RUNNER_TEMP/veilgram-private/fixture.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert str(d["api_id"])=="1"
          assert d["api_hash"]=="0"*32
          assert d["bundle_id"]=="org.veilgram.preflight"
          print("PASS: fixture config contains only intentionally unusable API identity")
          PY

      - name: Test release icon identity guard
        shell: bash
        run: |
          set -euo pipefail
          cd tools
          python3 -m unittest -v test_verify_release_icon_identity.py

      - name: Test device IPA platform verifier
        shell: bash
        run: |
          set -euo pipefail
          cd tools
          python3 -m unittest -v test_verify_device_ipa.py

      - name: Validate compile-only device profile generator
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/generate_compile_only_profiles.py
          grep -F 'NOT Apple valid' tools/generate_compile_only_profiles.py

      - name: Assert candidate contains no obvious credential literals
        shell: bash
        run: |
          set -euo pipefail
          ! git grep -I -E 'APP_HASH=[0-9a-fA-F]{32}|API_HASH=[0-9a-fA-F]{32}|stel_token=' -- ':!tools/test_*' ':!docs/*'
