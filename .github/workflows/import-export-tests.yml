name: Veilgram import export core tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-export-tests.yml'

permissions:
  contents: read

jobs:
  transfer:
    if: github.repository == 'Jigros/Veilgram-IOS'
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Checkout import-export branch
        uses: actions/checkout@v4
        with:
          ref: feature/import-export-core
          persist-credentials: false
          submodules: false

      - name: Compile and run transfer-envelope tests
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
          xcrun swiftc -parse-as-library -warnings-as-errors \
            submodules/TelegramUI/Sources/VeilgramTransferEnvelope.swift \
            tools/test_veilgram_transfer_envelope.swift \
            -o "$RUNNER_TEMP/veilgram-transfer-test"
          "$RUNNER_TEMP/veilgram-transfer-test"

      - name: Reject auth and network dependencies
        shell: bash
        run: |
          set -euo pipefail
          ! grep -E -n 'URLSession|NWConnection|TelegramEngine|Postbox' submodules/TelegramUI/Sources/VeilgramTransferEnvelope.swift
