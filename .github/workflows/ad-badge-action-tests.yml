name: Veilgram ad badge action tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ad-badge-action-tests.yml'

permissions:
  contents: read

jobs:
  badge:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/native-channel-ad-classifier
          persist-credentials: false
          submodules: false
      - name: Verify Possible ad badge interaction
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check_veilgram_ad_badge_action.py
