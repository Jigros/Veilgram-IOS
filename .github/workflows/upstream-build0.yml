name: BUILD-0 upstream simulator

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/upstream-build0.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upstream-simulator:
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - name: Checkout research repository
        uses: actions/checkout@v4
      - name: Checkout exact Telegram-iOS upstream
        uses: actions/checkout@v4
        with:
          repository: TelegramMessenger/Telegram-iOS
          ref: 6ad963e5b62d354da79040f388ae2b9132fb17b8
          submodules: recursive
          path: upstream
          persist-credentials: false
      - name: Validate pinned source and toolchain
        shell: bash
        run: |
          set -euo pipefail
          cd upstream
          test "$(git rev-parse HEAD)" = "6ad963e5b62d354da79040f388ae2b9132fb17b8"
          required_xcode="$(python3 -c 'import json; print(json.load(open("versions.json"))["xcode"])')"
          required_macos="$(python3 -c 'import json; print(json.load(open("versions.json"))["macos"])')"
          test "$required_xcode" = "26.2"
          test "$required_macos" = "26"
          sudo xcode-select -s "/Applications/Xcode_${required_xcode}.app/Contents/Developer"
          xcodebuild -version
          swift --version
          sw_vers
          python3 -c 'import json; print(json.dumps(json.load(open("versions.json")), indent=2))' | tee ../versions-record.json
          git rev-parse HEAD | tee ../upstream-sha.txt
          git submodule status --recursive > ../submodules-record.txt
      - name: Build unsigned simulator target
        shell: bash
        run: |
          set -euo pipefail
          cd upstream
          python3 - <<'PY'
          import json
          with open("build-system/template_minimal_development_configuration.json") as f:
              config = json.load(f)
          config.update(bundle_id="org.veilgram.build0.Telegram", api_id="1", api_hash="0"*32, team_id="AAAAAAAAAA", app_specific_url_scheme="veilgram-build0")
          with open("build0-configuration.json", "w") as f:
              json.dump(config, f)
          PY
          # Synthetic credentials support compilation only; this build cannot sign in.
          python3 -u build-system/Make/Make.py \
            --cacheDir="$RUNNER_TEMP/telegram-bazel-cache" \
            --bazelArguments="--//Telegram:disableProvisioningProfiles" \
            build \
            --configurationPath=build0-configuration.json \
            --xcodeManagedCodesigning \
            --configuration=debug_sim_arm64 \
            --buildNumber=1 2>&1 | tee ../build0.log
      - name: Record outcome
        if: always()
        shell: bash
        run: |
          {
            echo "research_sha=$GITHUB_SHA"
            echo "upstream_sha=6ad963e5b62d354da79040f388ae2b9132fb17b8"
            echo "runner=macos-26"
            echo "target=Telegram"
            echo "configuration=debug_sim_arm64"
            echo "signing=simulator_disabled"
          } > build0-metadata.txt
          if [ -f build0.log ]; then shasum -a 256 build0.log > build0-log.sha256; fi
          if [ -d upstream ]; then
            find upstream/bazel-out -type f \( -name '*.app' -o -name '*.ipa' \) -print 2>/dev/null | head -20 > build0-artifact-paths.txt || true
          fi
      - name: Upload logs and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build0-evidence
          path: |
            build0.log
            build0-log.sha256
            build0-metadata.txt
            build0-artifact-paths.txt
            versions-record.json
            upstream-sha.txt
            submodules-record.txt
          if-no-files-found: warn
