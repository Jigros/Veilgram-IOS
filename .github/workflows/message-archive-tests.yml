name: Veilgram message archive core tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/message-archive-tests.yml'

permissions:
  contents: read

jobs:
  archive:
    if: github.repository == 'Jigros/Veilgram-IOS'
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Checkout message-archive branch
        uses: actions/checkout@v4
        with:
          ref: feature/message-archive-core
          persist-credentials: false
          submodules: false

      - name: Compile and run archive model tests
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
          xcrun swiftc -parse-as-library -warnings-as-errors \
            submodules/TelegramUI/Sources/VeilgramMessageArchive.swift \
            tools/test_veilgram_message_archive.swift \
            -o "$RUNNER_TEMP/veilgram-message-archive-test"
          "$RUNNER_TEMP/veilgram-message-archive-test"

      - name: Enforce storage-model-only core
        shell: bash
        run: |
          set -euo pipefail
          ! grep -E -n 'URLSession|NWConnection|API_HASH|API_ID|TelegramEngine|Postbox' submodules/TelegramUI/Sources/VeilgramMessageArchive.swift
