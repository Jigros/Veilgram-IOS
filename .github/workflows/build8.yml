name: BUILD-8 Veilgram local-features editor integration compile

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["BUILD-7 Veilgram archive adapter integration compile"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: build8-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build8:
    if: |
      github.repository == 'Jigros/Veilgram-IOS' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - name: Checkout branded product source
        uses: actions/checkout@v4
        with:
          ref: refactor/veilgram-local-features-module
          submodules: false
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve upstream-relative Git submodule URLs
        shell: bash
        run: |
          set -euo pipefail
          # Official upstream uses relative URLs; on a standalone Veilgram
          # repository they incorrectly resolve to non-existent Jigros repos.
          # Override only checkout-local config, preserving tracked .gitmodules
          # and every pinned gitlink SHA.
          git config submodule.submodules/rlottie/rlottie.url https://github.com/TelegramMessenger/rlottie.git
          git config submodule.submodules/TgVoipWebrtc/tgcalls.url https://github.com/TelegramMessenger/tgcalls.git
          git -c protocol.file.allow=never submodule update --init --recursive
          git submodule status --recursive > "$RUNNER_TEMP/build8-submodules.txt"

      - name: Validate source and toolchain
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check_veilgram_branding.py
          python3 -m py_compile tools/verify_build1_ipa.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          v = json.loads(Path("versions.json").read_text())
          assert v["macos"] == "26", v
          assert v["xcode"] == "26.2", v
          assert v["bazel"].split(":")[0] == "8.4.2", v
          PY
          test "$(sw_vers -productVersion | cut -d. -f1)" = "26"
          sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
          xcodebuild -version
          test "$(xcodebuild -version | head -1)" = "Xcode 26.2"
          git rev-parse HEAD > "$RUNNER_TEMP/build8-source-sha.txt"
          echo "Branded source SHA: $(cat "$RUNNER_TEMP/build8-source-sha.txt")"
          date -u +%Y-%m-%dT%H:%M:%SZ > "$RUNNER_TEMP/build8-date.txt"

      - name: Generate synthetic compile-only config
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          base = json.loads(Path("build-system/template_minimal_development_configuration.json").read_text())
          base.update(
              bundle_id="org.veilgram.buildone",
              api_id="1",
              api_hash="0" * 32,
              team_id="AAAAAAAAAA",
              app_specific_url_scheme="veilgram-buildone"
          )
          Path("build8-configuration.json").write_text(json.dumps(base), encoding="utf-8")
          PY
          printf '\nbuild --//Telegram:disableProvisioningProfiles\n' >> .bazelrc

      - name: Restore bounded public fixture Bazel cache
        uses: actions/cache/restore@v4
        with:
          path: ~/veilgram-public-bazel-disk-cache
          key: veilgram-public-macos26-xcode26.2-bazel8.4.2-${{ github.run_id }}
          restore-keys: |
            veilgram-public-macos26-xcode26.2-bazel8.4.2-

      - name: Compile branded simulator (not an installable signed build)
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$HOME/veilgram-public-bazel-disk-cache"
          python3 -u build-system/Make/Make.py \
            --cacheDir="$HOME/veilgram-public-bazel-disk-cache" \
            build \
            --configurationPath=build8-configuration.json \
            --xcodeManagedCodesigning \
            --configuration=debug_sim_arm64 \
            --buildNumber=1 2>&1 | tee "$RUNNER_TEMP/build8-compile.log"
          result=${PIPESTATUS[0]}
          echo "Compile exit: $result"
          printf '%s\n' "$result" > "$RUNNER_TEMP/build8-exit-code.txt"
          if [ "$result" -ne 0 ]; then
            tail -n 100 "$RUNNER_TEMP/build8-compile.log"
          fi
          exit "$result"

      - name: Validate IPA identity and record hash
        shell: bash
        run: |
          set -euo pipefail
          test -f bazel-bin/Telegram/Telegram.ipa
          cp bazel-bin/Telegram/Telegram.ipa "$RUNNER_TEMP/build8-simulator.ipa"
          python3 tools/verify_build1_ipa.py "$RUNNER_TEMP/build8-simulator.ipa" \
            --bundle-id org.veilgram.buildone \
            --report "$RUNNER_TEMP/build8-identity.json"
          shasum -a 256 "$RUNNER_TEMP/build8-simulator.ipa" > "$RUNNER_TEMP/build8-ipa.sha256"

      - name: Upload simulator test evidence (only when validated)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: build8-settings-evidence
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/build8-simulator.ipa
            ${{ runner.temp }}/build8-source-sha.txt
            ${{ runner.temp }}/build8-date.txt
            ${{ runner.temp }}/build8-exit-code.txt
            ${{ runner.temp }}/build8-identity.json
            ${{ runner.temp }}/build8-ipa.sha256

      - name: Bound public fixture cache before upload
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path.home() / "veilgram-public-bazel-disk-cache"
          limit = 2500 * 1024 * 1024
          files = []
          total = 0
          if root.exists():
              for path in root.rglob("*"):
                  if path.is_file() and not path.is_symlink():
                      try:
                          stat = path.stat()
                      except FileNotFoundError:
                          continue
                      total += stat.st_size
                      files.append((stat.st_mtime, stat.st_size, path))
          for _, size, path in sorted(files):
              if total <= limit:
                  break
              try:
                  path.unlink()
                  total -= size
              except FileNotFoundError:
                  pass
          print(f"Bound public Bazel cache to {total / 1024 / 1024:.1f} MiB")
          PY

      - name: Save bounded public fixture Bazel cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/veilgram-public-bazel-disk-cache
          key: veilgram-public-macos26-xcode26.2-bazel8.4.2-${{ github.run_id }}

      - name: Upload diagnostic compilation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build8-settings-diagnostics
          retention-days: 7
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/build8-compile.log
            ${{ runner.temp }}/build8-exit-code.txt
            ${{ runner.temp }}/build8-source-sha.txt
            ${{ runner.temp }}/build8-submodules.txt
